<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#bgGradient)"/>

  <!-- Ship/Boat (kepala) -->
  <g transform="translate(50, 38)">
    <!-- Hull perahu -->
    <path d="M -22 6 Q -20 12 -14 12 L 14 12 Q 20 12 22 6 Z"
          fill="#c0c8d4" stroke="#8b95a5" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Deck line -->
    <line x1="-18" y1="6" x2="18" y2="6" stroke="#8b95a5" stroke-width="0.8"/>
    <!-- Tiang -->
    <rect x="-1.5" y="-8" width="3" height="14" fill="#8b95a5" rx="1"/>
    <!-- Layar -->
    <path d="M 1.5 -8 L 14 -3 L 1.5 3 Z" fill="#e8ecf3" stroke="#8b95a5" stroke-width="1"/>
  </g>

  <!-- Body kayu -->
  <path d="M 35 52 Q 35 48 40 48 L 60 48 Q 65 48 65 52 L 62 75 Q 60 80 50 80 Q 40 80 38 75 Z"
        fill="url(#woodGradient)"/>

  <!-- Sayap buku (kiri) -->
  <path d="M 38 52 Q 24 55 20 68 L 30 68 Q 34 58 40 55 Z"
        fill="#a78bfa" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 22 66 L 30 65 Q 33 58 39 55"
        fill="none" stroke="#ffffff" stroke-width="0.6"/>

  <!-- Sayap buku (kanan) -->
  <path d="M 62 52 Q 76 55 80 68 L 70 68 Q 66 58 60 55 Z"
        fill="#a78bfa" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 78 66 L 70 65 Q 67 58 61 55"
        fill="none" stroke="#ffffff" stroke-width="0.6"/>

  <!-- Wajah -->
  <g transform="translate(50, 60)">
    <!-- Mata -->
    <circle cx="-6" cy="0" r="1.8" fill="#1a1a2e"/>
    <circle cx="6" cy="0" r="1.8" fill="#1a1a2e"/>
    <circle cx="-5.4" cy="-0.6" r="0.7" fill="#ffffff"/>
    <circle cx="6.6" cy="-0.6" r="0.7" fill="#ffffff"/>
    <!-- Senyum -->
    <path d="M -3 4 Q 0 6.5 3 4" fill="none" stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Pipi pink -->
    <circle cx="-9" cy="3" r="1.5" fill="#fda4af" opacity="0.6"/>
    <circle cx="9" cy="3" r="1.5" fill="#fda4af" opacity="0.6"/>
  </g>

  <!-- Padi (kiri bawah) -->
  <g transform="translate(30, 74)">
    <line x1="0" y1="0" x2="-4" y2="-10" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="-3" cy="-9" rx="1.2" ry="2.5" fill="#fbbf24" transform="rotate(-30 -3 -9)"/>
    <ellipse cx="-5" cy="-7" rx="1.2" ry="2.5" fill="#fbbf24" transform="rotate(-45 -5 -7)"/>
    <ellipse cx="-5.5" cy="-4" rx="1.2" ry="2.5" fill="#fbbf24" transform="rotate(-60 -5.5 -4)"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
</svg>